port: 2355
save_video: true
seed: 0

PipelineParams:
  convert_SHs_python: false

ModelParams:
  workspace: segs_example
  sh_degree: 0
  bg_aug_ratio: 0.66

GuidanceParams:
  model_key: "stabilityai/stable-diffusion-2-1-base"
  text: "a DSLR photo of a baby dragon hatching out of a stone egg"
  negative: ""
  inverse_text: ""
  perpneg: false
  C_batch_size: 1
  t_range: [0.02, 0.5]
  max_t_range: 0.98
  lambda_guidance: 0.1
  guidance_scale: 7.5
  denoise_guidance_scale: 1.0
  noise_seed: 0
  pca_guidance_scale: 120
  num_samples_per_group: 3
  feature_dim: 64
  pca_result: "pca_result/segs_example/top3_pca.pt"
  initial_text: "a dragon"
  ddim_inv: true
  annealing_intervals: true
  xs_delta_t: 200
  xs_inv_steps: 5
  xs_eta: 0.0
  delta_t: 80
  delta_t_start: 100

GenerateCamParams:
  init_shape: "pointe"
  init_prompt: "a dragon"
  use_pointe_rgb: false
  init_num_pts: 100000
  phi_range: [-180, 180]
